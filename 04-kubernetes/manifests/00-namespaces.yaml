# Two "tenants". In a real platform these would be two client banks.
# Pod Security Admission labels enforce the restricted profile:
#   - no privileged containers
#   - must run as non-root
#   - no host namespaces, no hostPath volumes
#   - seccomp profile required, capabilities dropped
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
