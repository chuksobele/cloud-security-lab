# This pod SHOULD BE REJECTED by Pod Security Admission in a namespace labelled
# enforce=restricted. Apply it and capture the rejection message as evidence.
#
# It asks for: privileged mode, the host PID namespace, and a hostPath mount of
# the host root filesystem - which together are a container escape in one manifest.
apiVersion: v1
kind: Pod
metadata:
  name: should-be-rejected
  namespace: tenant-a
spec:
  hostPID: true
  containers:
    - name: bad
      image: busybox:1.36
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
        runAsUser: 0
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath: { path: / }
